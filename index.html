<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OceanLink Global - Oficial</title>
    <style>
        /* RESET GENERAL */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            height: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: white; 
            background-color: #0b111e; 
            scroll-behavior: smooth;
        }

        /* BARRA DE NAVEGACIÓN (Línea 11 que querías arreglar) */
        nav { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 40px; 
            background: rgba(11, 17, 30, 0.95); 
            z-index: 1000;
            border-bottom: 1px solid #1f2937;
        }

        .logo img { 
            height: 60px; 
            width: auto; 
            display: block;
        }

        .menu-links a { 
            color: white; 
            text-decoration: none; 
            margin-left: 20px; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            font-weight: bold;
            transition: color 0.3s;
        }

        .menu-links a:hover {
            color: #00d4ff;
        }

        /* SECCIONES DE RELLENO PARA QUE LA PAGINA TENGA CUERPO */
        section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }

        #inicio { background: radial-gradient(circle, #1a2a4a 0%, #0b111e 100%); }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <a href="index.html">
                <img src="logo-web.png" alt="OceanLink Global">
            </a>
        </div>
        <div class="menu-links">
            <a href="#inicio">Inicio</a>
            <a href="#bienvenida">Bienvenida</a>
            <a href="#tecnologia">Tecnología</a>
            <a href="#servicio">Servicio</a>
            <a href="#suscripcion">Suscripción</a>
            <a href="#blog">Blog</a>
            <a href="#contacto">Contacto</a>
        </div>
    </nav>

    <section id="inicio">
        <h1>BIENVENIDO A OCEANLINK GLOBAL</h1>
    </section>

    </body>
</html>
